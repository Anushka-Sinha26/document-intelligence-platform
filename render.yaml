services:
  - type: web
    name: document-intelligence-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health

    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///document_intelligence.db